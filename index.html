<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>🇨🇳 → 🇻🇳 Vietsub</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
<h1>🇨🇳 → 🇻🇳 <span>Vietsub</span></h1>
<p>Dịch video tiếng Trung sang tiếng Việt theo ngữ cảnh.</p>

<label class="upload">
  <input id="video" type="file" accept="video/*,.mp4,.mov,.mkv,.webm">
  <span>📁 Chọn video</span>
</label>

<div id="selected" class="selected">Chưa chọn video</div>

<button id="go" disabled>🚀 Bắt đầu dịch</button>
<progress id="bar" value="0" max="100"></progress>
<p id="status">Chọn một video để bắt đầu.</p>
<a id="result" hidden>🎬 Mở / tải video Vietsub</a>
</main>
<script src="/static/app.js?v=3"></script>
</body>
</html>
